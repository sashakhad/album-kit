<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; media-src 'self' file: https://*.suno.ai; base-uri 'none'; form-action 'none'"
    />
    <title>{{title}}</title>
    <style>
      {{theme}}
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--background); color: var(--foreground); font: 1rem Geist, system-ui, sans-serif; }
      header { border-bottom: 1px solid var(--border); }
      header > div, main { max-width: 72rem; margin: auto; padding-inline: clamp(1rem, 4vw, 1.5rem); }
      header > div { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 4.25rem; }
      header strong { font-size: 1.375rem; font-weight: 550; letter-spacing: -.035em; }
      main { padding-block: 2.5rem; }
      h1, h2, p { margin: 0; }
      h1 { font-size: clamp(2rem, 5vw, 2.5rem); font-weight: 600; letter-spacing: -.04em; overflow-wrap: anywhere; }
      .artist, .muted, small { color: var(--muted-foreground); }
      .artist { margin-top: .375rem; }
      .layout { display: grid; align-items: start; gap: 2rem; margin-top: 2rem; }
      @media (min-width: 64rem) { .layout { grid-template-columns: minmax(0, 21rem) minmax(0, 1fr); } }
      .player { display: grid; gap: .75rem; }
      .player h2 { font-size: clamp(1.875rem, 4vw, 2.25rem); line-height: 1.1; letter-spacing: -.04em; overflow-wrap: anywhere; }
      .controls { display: flex; flex-wrap: wrap; gap: .5rem; margin-block: .375rem; }
      button { min-height: 2.75rem; font: inherit; font-size: .875rem; color: inherit; border: 1px solid var(--input); border-radius: .75rem; background: transparent; padding: .5rem .875rem; cursor: pointer; }
      button:hover { background: var(--accent); }
      button[disabled] { opacity: .45; cursor: default; }
      .primary, button[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); }
      .primary:hover, button[aria-pressed="true"]:hover { background: color-mix(in oklab, var(--primary) 90%, transparent); }
      :where(button, input):focus-visible { outline: 2px solid var(--primary); outline-offset: 4px; }
      .seek { display: flex; align-items: center; gap: .75rem; font: .75rem ui-monospace, monospace; color: var(--muted-foreground); }
      .seek input { width: 100%; accent-color: var(--primary); }
      .tracks { display: grid; gap: .75rem; }
      .track { min-width: 0; display: grid; gap: .75rem; padding: 1rem; border: 1px solid var(--border); border-radius: 1rem; background: var(--card); }
      .track h2 { font-size: 1rem; font-weight: 550; overflow-wrap: anywhere; }
      .track-number { font: .8rem ui-monospace, monospace; margin-right: .625rem; color: var(--muted-foreground); }
      .takes { display: flex; flex-wrap: wrap; gap: .5rem; }
      .take-row, .score-strip { display: inline-flex; align-items: stretch; border: 1px solid var(--border); border-radius: .65rem; }
      .take-row:has([aria-pressed="true"]) { border-color: var(--primary); }
      .take-row button, .score-strip button { min-width: 2.75rem; min-height: 2.75rem; border: 0; border-radius: .45rem; padding: .5rem; touch-action: manipulation; }
      .take-row [data-take] { border-right: 1px solid var(--border); border-radius: .55rem 0 0 .55rem; }
      .take-row button:focus-visible, .score-strip button:focus-visible { outline-offset: -3px; position: relative; }
      .take-score, #take-score { min-width: 2.75rem; align-self: center; text-align: center; font: .875rem ui-monospace, monospace; }
      [data-delta="-1"][data-active] { background: color-mix(in srgb, var(--destructive) 15%, transparent); color: var(--destructive); }
      [data-delta="1"][data-active] { background: var(--accent); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header>
      <div><strong>{{title}}</strong><span class="muted">Listen</span></div>
    </header>
    <main>
      <h1>{{title}}</h1>
      {{artist}}
      <div class="layout">
        <section class="player" aria-label="Album player" hidden>
          <h2 id="track-title"></h2>
          <p class="muted" id="take-label"></p>
          <div class="controls">
            <button id="previous" type="button" aria-label="Previous take">◀</button>
            <button id="play" class="primary" type="button">Play</button>
            <button id="next" type="button" aria-label="Next take">▶</button>
          </div>
          <label class="seek">
            <span id="elapsed">0:00</span>
            <input id="seek" type="range" min="0" max="0" value="0" step="0.1" aria-label="Seek" />
            <span id="duration">0:00</span>
          </label>
          <section id="ballot" aria-label="Compare takes" hidden>
            <p id="pass-label" class="muted" aria-live="polite">Pass 1</p>
            <p id="vote-progress" class="muted"></p>
            <p id="vote-storage" class="muted" role="status"></p>
            <div class="controls">
              <div class="score-strip" role="group" aria-label="Score the selected take">
                <button id="downvote" data-delta="-1" type="button" aria-label="Subtract one point">
                  −
                </button>
                <output id="take-score" aria-label="Take score">0</output>
                <button id="upvote" data-delta="1" type="button" aria-label="Add one point">
                  +
                </button>
              </div>
              <button id="next-unrated" type="button">Next unrated</button>
              <button id="next-pass" type="button">Next pass</button>
            </div>
            <p id="vote-status" class="muted" role="status"></p>
          </section>
          <p id="playback-error" role="status" class="muted"></p>
          <audio preload="none" hidden></audio>
          <video preload="none" playsinline hidden></video>
        </section>
        <div class="tracks" aria-label="Tracks">{{tracks}}</div>
      </div>
    </main>
    <script>
      const buttons = Array.from(document.querySelectorAll('.takes [data-take]'));
      if (buttons.length) {
        const player = document.querySelector('.player');
        const play = document.querySelector('#play');
        const previous = document.querySelector('#previous');
        const next = document.querySelector('#next');
        const seek = document.querySelector('#seek');
        const elapsed = document.querySelector('#elapsed');
        const duration = document.querySelector('#duration');
        const error = document.querySelector('#playback-error');
        const audio = player.querySelector('audio');
        const video = player.querySelector('video');
        let current = 0;
        let media = audio;
        const ballot = document.querySelector('#ballot');
        const upvote = document.querySelector('#upvote');
        const downvote = document.querySelector('#downvote');
        const unrated = document.querySelector('#next-unrated');
        const nextPass = document.querySelector('#next-pass');
        const voteStatus = document.querySelector('#vote-status');
        const voteStorage = document.querySelector('#vote-storage');
        const albumKey = {{albumKey}};
        let votes = {};
        let pass = 1;
        let retired = [];
        let writes = Promise.resolve();
        const localServer = location.protocol === 'http:' && location.hostname === '127.0.0.1';
        const storageKey = 'album-kit-preview-ballot-' + albumKey;
        const temporaryScores = 'Scores clear when you close or reload this page.';

        function renderScore(group, score) {
          group.querySelector('output').textContent = score > 0 ? '+' + score : String(score);
          for (const step of group.querySelectorAll('[data-delta]')) {
            step.toggleAttribute('data-active', Math.sign(score) === Number(step.dataset.delta));
            step.disabled = ballot.hidden;
          }
        }

        function showVotes() {
          const selected = buttons[current];
          renderScore(upvote.parentElement, votes[selected.dataset.id] ?? 0);
          for (const button of buttons) {
            renderScore(button.closest('.take-row'), votes[button.dataset.id] ?? 0);
          }
          const trackTakes = buttons.filter(
            button => !button.hidden && button.closest('.track') === selected.closest('.track')
          );
          const count = trackTakes.filter(button => Object.hasOwn(votes, button.dataset.id)).length;
          document.querySelector('#vote-progress').textContent =
            count + ' of ' + trackTakes.length + ' rated';
          document.querySelector('#pass-label').textContent = 'Pass ' + pass;
          previous.disabled = nextVisible(0) === current;
          next.disabled = nextVisible(current + 1) < 0;
          unrated.disabled = buttons.every(
            button => button.hidden || Object.hasOwn(votes, button.dataset.id)
          );
        }

        function applyRetired(ids) {
          retired = Array.isArray(ids) ? ids : [];
          for (const button of buttons) {
            button.hidden = retired.includes(button.dataset.id);
            button.closest('.take-row').hidden = button.hidden;
          }
          for (const empty of document.querySelectorAll('[data-pass-empty]')) {
            empty.hidden = !!empty.closest('.track').querySelector('.take-row:not([hidden])');
          }
        }

        function nextVisible(start) {
          for (let index = start; index < buttons.length; index += 1) {
            if (!buttons[index].hidden) return index;
          }
          return -1;
        }

        function stayOnVisible() {
          if (!buttons[current].hidden) return showVotes();
          const index = nextVisible(0);
          if (index >= 0) return select(index, false);
          media.pause();
          player.hidden = true;
        }

        function saveBallot(vote, target = buttons[current]) {
          if (ballot.hidden) return;
          const take = target.dataset.id;
          const selected = buttons[current].dataset.id;
          writes = writes
            .then(async () => {
              if (retired.includes(take) && vote !== 'next-pass') return;
              if (!localServer) {
                const nextBallot = { albumKey, pass, selected, votes: { ...votes }, retired };
                if (vote === 'next-pass') {
                  const kept = {};
                  const dropped = retired.slice();
                  for (const [id, score] of Object.entries(votes)) {
                    if (score < 0) {
                      if (!dropped.includes(id)) dropped.push(id);
                    } else kept[id] = score;
                  }
                  nextBallot.pass = pass + 1;
                  nextBallot.votes = kept;
                  nextBallot.retired = dropped;
                  if (dropped.includes(selected)) nextBallot.selected = null;
                } else if (vote !== undefined) {
                  nextBallot.votes[take] = (votes[take] ?? 0) + vote;
                }
                try {
                  localStorage.setItem(storageKey, JSON.stringify(nextBallot));
                  voteStorage.textContent = '';
                } catch {
                  voteStorage.textContent = temporaryScores;
                }
                votes = nextBallot.votes;
                pass = nextBallot.pass;
                applyRetired(nextBallot.retired);
                voteStatus.textContent = '';
                stayOnVisible();
                return;
              }
              const response = await fetch('/ballot', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(vote === 'next-pass' ? { action: 'next-pass' } : { take, vote, select: take === selected }),
              });
              if (!response.ok) throw new Error('Save failed');
              const saved = await response.json();
              votes = saved.votes;
              pass = saved.pass || 1;
              applyRetired(saved.retired);
              voteStatus.textContent = '';
              stayOnVisible();
            })
            .catch(() => {
              voteStatus.textContent = 'Could not save. Try again.';
            });
        }

        function formatTime(seconds) {
          const time = Number.isFinite(seconds) ? Math.floor(seconds) : 0;
          return Math.floor(time / 60) + ':' + String(time % 60).padStart(2, '0');
        }

        function sync() {
          const length = Number.isFinite(media.duration) ? media.duration : 0;
          play.textContent = media.paused ? 'Play' : 'Pause';
          elapsed.textContent = formatTime(media.currentTime);
          duration.textContent = formatTime(length);
          seek.disabled = length === 0;
          seek.max = String(length);
          seek.value = String(media.currentTime);
        }

        function select(index, remember = true) {
          media.pause();
          buttons[current].setAttribute('aria-pressed', 'false');
          current = index;
          const { src, title, label, kind } = buttons[current].dataset;
          media = kind === 'video' ? video : audio;
          media.src = src;
          document.querySelector('#track-title').textContent = title;
          document.querySelector('#take-label').textContent = label;
          buttons[current].setAttribute('aria-pressed', 'true');
          error.textContent = '';
          sync();
          showVotes();
          if (remember) saveBallot();
        }

        for (const item of [audio, video]) {
          for (const name of ['loadedmetadata', 'timeupdate', 'play', 'pause', 'ended']) {
            item.addEventListener(name, () => {
              if (item === media) sync();
            });
          }
        }

        play.addEventListener('click', async () => {
          error.textContent = '';
          if (!media.paused) {
            media.pause();
            return;
          }
          const selected = media;
          try {
            await selected.play();
          } catch {
            if (selected !== media) return;
            error.textContent =
              buttons[current].dataset.online === 'true'
                ? navigator.onLine === false
                  ? 'Reconnect and press Play again.'
                  : 'Couldn’t play this take. Press Play to retry.'
                : 'Couldn’t play this take. Keep the audio folder beside this page.';
          }
        });
        seek.addEventListener('input', () => {
          media.currentTime = Number(seek.value);
        });
        previous.addEventListener('click', () => {
          for (let index = current - 1; index >= 0; index -= 1) {
            if (!buttons[index].hidden) return select(index);
          }
        });
        next.addEventListener('click', () => {
          const index = nextVisible(current + 1);
          if (index >= 0) select(index);
        });
        buttons.forEach((button, index) => {
          button.addEventListener('click', () => select(index));
          for (const step of button.closest('.take-row').querySelectorAll('[data-delta]')) {
            step.addEventListener('click', () => saveBallot(Number(step.dataset.delta), button));
          }
        });
        upvote.addEventListener('click', () => saveBallot(1));
        downvote.addEventListener('click', () => saveBallot(-1));
        nextPass.addEventListener('click', () => saveBallot('next-pass'));
        unrated.addEventListener('click', async () => {
          await writes;
          const ordered = buttons.slice(current + 1).concat(buttons.slice(0, current + 1));
          const nextTake = ordered.find(button => !button.hidden && !Object.hasOwn(votes, button.dataset.id));
          if (nextTake) select(buttons.indexOf(nextTake));
        });
        player.hidden = false;
        select(0, false);
        function restore(saved) {
          if (saved.albumKey && saved.albumKey !== albumKey) saved = { votes: {} };
          votes = saved.votes || {};
          pass = saved.pass || 1;
          applyRetired(saved.retired);
          ballot.hidden = false;
          const index = buttons.findIndex(button => button.dataset.id === saved.selected);
          if (index >= 0 && !buttons[index].hidden) select(index, false);
          else stayOnVisible();
        }
        const loadError = () => {
          error.textContent = 'Could not load local votes. Reload to retry.';
        };

        if (!localServer) {
          try {
            const saved = JSON.parse(localStorage.getItem(storageKey));
            restore(saved ?? { selected: null, votes: {} });
          } catch {
            voteStorage.textContent = temporaryScores;
            restore({ votes: {} });
          }
        } else {
          fetch('/ballot')
            .then(response => {
              if (!response.ok) throw new Error('Load failed');
              return response.json();
            })
            .then(restore)
            .catch(loadError);
        }
      }
    </script>
  </body>
</html>
